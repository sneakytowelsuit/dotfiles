name: Validate Conduct

on:
  push:
    paths:
      - "herdr-conduct/**"
      - ".github/workflows/validate-conduct.yml"
  pull_request:
    paths:
      - "herdr-conduct/**"
      - ".github/workflows/validate-conduct.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: herdr-conduct
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Check shared mod copies
        run: |
          sh -n sync-shared.sh
          ./sync-shared.sh
          git diff --exit-code -- mods
          test -z "$(git ls-files --others --exclude-standard -- mods)"
      - name: Test formats, harnesses, and shared behavior
        run: |
          find mods -name '*.js' -print0 | xargs -0 -r -n1 node --check
          node --test test/**/*.test.mjs
