name: Validate workstation configuration

on:
  push:
    paths:
      - "dotfiles/**"
      - "bootstrap/**"
      - "tests/**"
      - "mise.toml"
      - "os/build_files/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "dotfiles/**"
      - "bootstrap/**"
      - "tests/**"
      - "mise.toml"
      - "os/build_files/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh python3-yaml nodejs
          bash bootstrap/install-mise.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check shell, TOML, and workflow syntax
        run: |
          for script in bootstrap/*.sh; do bash -n "$script"; done
          shellcheck bootstrap/*.sh
          for config in dotfiles/.zshenv dotfiles/.config/zsh/.zprofile dotfiles/.config/zsh/.zshrc dotfiles/.config/zsh/plugins.zsh; do
            zsh -n "$config"
          done
          python3 - <<'PY'
          import pathlib, tomllib, yaml
          for path in [pathlib.Path('mise.toml'), *pathlib.Path('dotfiles').rglob('*.toml')]:
              tomllib.loads(path.read_text())
          for path in pathlib.Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(path.read_text())
          PY
      - name: Check safe deployment and legacy migration
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check preview image retention safeguards
        run: node tests/test_cleanup.mjs
