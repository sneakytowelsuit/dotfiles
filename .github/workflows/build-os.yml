name: Build workstation OS

on:
  push:
    paths:
      - "os/**"
      - "dotfiles/**"
      - "bootstrap/**"
      - "mise.toml"
      - ".containerignore"
      - ".github/workflows/build-os.yml"
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'workstation-stable-publish' || 'workstation-preview-publish-and-cleanup' }}
  cancel-in-progress: false

jobs:
  check-base:
    runs-on: ubuntu-24.04
    outputs:
      base_digest: ${{ steps.compare.outputs.base_digest }}
      should_build: ${{ steps.compare.outputs.should_build }}
    steps:
      - name: Install image inspection tool
        run: sudo apt-get update && sudo apt-get install -y skopeo jq
      - name: Compare upstream digest with published image
        id: compare
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/workstation:stable"
          base_digest="$(skopeo inspect --no-tags docker://ghcr.io/ublue-os/aurora-dx:stable | jq -r .Digest)"
          if [[ -z "$base_digest" || "$base_digest" == null ]]; then
            echo 'Could not resolve Aurora DX Stable digest' >&2
            exit 1
          fi
          echo "base_digest=$base_digest" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            authfile="$RUNNER_TEMP/ghcr-auth.json"
            printf '%s' "$GH_TOKEN" | skopeo login --authfile "$authfile" ghcr.io --username "$GITHUB_ACTOR" --password-stdin
            published_digest="$(skopeo inspect --authfile "$authfile" --config "docker://$image" 2>/dev/null | jq -r '.config.Labels["io.workstation.base-digest"] // empty' || true)"
            if [[ "$published_digest" == "$base_digest" ]]; then
              echo 'Aurora DX Stable digest is unchanged; skipping image build.'
              echo 'should_build=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'should_build=true' >> "$GITHUB_OUTPUT"

  build:
    needs: check-base
    if: needs.check-base.outputs.should_build == 'true' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require signing key
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: test -n "$SIGNING_SECRET"
      - name: Set image name and channel
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            package=workstation
            channel=stable
          else
            package=workstation-preview
            slug="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-50)"
            branch_hash="$(printf '%s' "$GITHUB_REF_NAME" | sha256sum | cut -c1-8)"
            channel="test-${slug:-branch}-${branch_hash}"
          fi
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$package" >> "$GITHUB_ENV"
          echo "CHANNEL=$channel" >> "$GITHUB_ENV"
      - name: Build current Aurora DX Stable
        env:
          BASE_DIGEST: ${{ needs.check-base.outputs.base_digest }}
        run: |
          podman build --pull=always \
            --build-arg "BASE_IMAGE=ghcr.io/ublue-os/aurora-dx@${BASE_DIGEST}" \
            --build-arg "BASE_DIGEST=${BASE_DIGEST}" \
            --build-arg "SOURCE_REPOSITORY=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
            --file os/Containerfile --tag localhost/workstation:${{ github.sha }} .
      - name: Check workstation image
        run: |
          podman run --rm localhost/workstation:${{ github.sha }} rpm -q ghostty foot
          podman run --rm --env XDG_CONFIG_HOME=/tmp/config \
            --volume "$PWD/dotfiles/.config/ghostty:/tmp/config/ghostty:ro" \
            localhost/workstation:${{ github.sha }} ghostty +validate-config
          podman run --rm localhost/workstation:${{ github.sha }} just --unstable --fmt --check --justfile /usr/share/ublue-os/just/60-custom.just
          podman run --rm localhost/workstation:${{ github.sha }} ujust --list > /tmp/ujust-recipes
          grep -q workstation-sync /tmp/ujust-recipes
          grep -q workstation-capture-brew /tmp/ujust-recipes
          grep -q workstation-image-sync /tmp/ujust-recipes
          podman run --rm localhost/workstation:${{ github.sha }} mise --version
          podman run --rm --env HOME=/tmp/workstation-home \
            localhost/workstation:${{ github.sha }} bash -c '
              mkdir -p "$HOME"
              mise trust /usr/share/workstation/mise.toml
              mise -C /usr/share/workstation dotfiles apply
              test -L "$HOME/.config/niri/config.kdl"
              test -L "$HOME/.config/mise/config.toml"
              test ! -e /usr/share/workstation/cosign.key
            '

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.docker"
          printf '%s' "$GH_TOKEN" | podman login ghcr.io --authfile "$HOME/.docker/config.json" --username "$GITHUB_ACTOR" --password-stdin
      - name: Push commit image
        run: podman push --authfile "$HOME/.docker/config.json" --digestfile /tmp/image-digest localhost/workstation:${{ github.sha }} "${IMAGE}:sha-${{ github.sha }}"
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign image digest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          digest="$(cat /tmp/image-digest)"
          cosign sign --yes --new-bundle-format=false --use-signing-config=false --registry-referrers-mode=legacy --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${digest}"
      - name: Publish channel tag
        run: podman push --authfile "$HOME/.docker/config.json" localhost/workstation:${{ github.sha }} "${IMAGE}:${CHANNEL}"
      - name: Write testing instructions
        run: |
          {
            echo "Image: \`${IMAGE}:${CHANNEL}\`"
            echo
            echo '```bash'
            echo "cosign verify --key cosign.pub --new-bundle-format=false ${IMAGE}:${CHANNEL}"
            echo "sudo bootc switch ${IMAGE}:${CHANNEL}"
            echo 'sudo systemctl reboot'
            echo '# After reboot, apply the configuration bundled with this image:'
            echo 'ujust workstation-image-sync'
            echo '```'
            if [[ "$CHANNEL" != stable ]]; then
              echo 'Preview versions expire after 7 days, at the next hourly cleanup. Return to workstation:stable before expiry.'
              echo 'The cleanup workflow must be installed on the default branch to enforce expiry.'
              echo 'New GHCR packages start private. Make workstation-preview public in its package settings, or configure registry authentication before switching.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
