name: Validate NixOS configuration

on:
  push:
    paths:
      - "nixos/**"
      - ".github/workflows/validate-nixos.yml"
  pull_request:
    paths:
      - "nixos/**"
      - ".github/workflows/validate-nixos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: nixos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Evaluate the system
        run: nix build .#nixosConfigurations.framework.config.system.build.toplevel --dry-run
