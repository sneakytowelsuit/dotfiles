name: Validate NixOS configuration

on:
  push:
    paths:
      - "nixos/**"
      - ".github/workflows/validate-nixos.yml"
  pull_request:
    paths:
      - "nixos/**"
      - ".github/workflows/validate-nixos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: nixos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Evaluate the system
        run: nix build .#nixosConfigurations.framework.config.system.build.toplevel --dry-run
