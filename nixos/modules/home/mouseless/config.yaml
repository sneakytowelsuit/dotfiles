# mouseless config: https://github.com/jbensmann/mouseless
# Hold Left Alt (tap = Left Alt) to enter the "mouse" layer. Caps Lock is
# already Esc/Ctrl via keyd (see nixos/keyboard.nix), so it is not used here.
# Read only keyd's virtual keyboard (keyd already grabs the physical ones).
# This mouseless version wants a device *path*, which changes between boots, so
# the service fills in the placeholder below (see ../mouseless.nix).
devices:
  - "@KEYD_DEVICE@"
baseMouseSpeed: 750.0

layers:
  - name: initial
    bindings:
      leftalt: tap-hold-next-release leftalt ; toggle-layer mouse ; 200

  - name: mouse
    bindings:
      h: move -1 0
      j: move 0 1
      k: move 0 -1
      l: move 1 0
      y: scroll left
      u: scroll down
      i: scroll up
      o: scroll right
      f: speed 3.0
      d: speed 0.3
      space: button left
      a: button middle
      s: button right
