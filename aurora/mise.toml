# Workstation setup. Runtime defaults deployed to ~/.config/mise apply everywhere.
min_version = "2026.10.13"
include = ["dotfiles/.config/mise/config.toml"]

[bootstrap.packages]
"brew:zinit" = "latest"
"brew:starship" = "latest"
"brew:fzf" = "latest"
"brew:zoxide" = "latest"
"brew:atuin" = "latest"
"brew:gh" = "latest"
"brew:cosign" = "latest"
"brew:jq" = "latest"
"brew:yq" = "latest"
"brew:ripgrep" = "latest"
"brew:fd" = "latest"
"brew:bat" = "latest"
"brew:eza" = "latest"
"brew:bash-preexec" = "latest"
"brew:bbrew" = "latest"
"brew:bitwarden-cli" = "latest"
"brew:cdk8s" = "latest"
"brew:chezmoi" = "latest"
"brew:devcontainer" = "latest"
"brew:direnv" = "latest"
"brew:dysk" = "latest"
"brew:k9s" = "latest"
"brew:kind" = "latest"
"brew:kubernetes-cli" = "latest"
"brew:lazygit" = "latest"
"brew:llm" = "latest"
"brew:llmfit" = "latest"
"brew:neovim" = "latest"
"brew:ollama" = "latest"
"brew:opencode" = "latest"
"brew:podman-tui" = "latest"
"brew:ramalama" = "latest"
"brew:tealdeer" = "latest"
"brew:trash-cli" = "latest"
"brew:ugrep" = "latest"
"brew:uutils-coreutils" = "latest"
"brew:llmmanorg/tap/llmman" = "latest"
"brew:ublue-os/tap/linux-mcp-server" = "latest"
"brew-cask:font-0xproto-nerd-font" = "latest"
"brew-cask:font-blex-mono-nerd-font" = "latest"
"brew-cask:font-caskaydia-mono-nerd-font" = "latest"
"brew-cask:font-comic-shanns-mono-nerd-font" = "latest"
"brew-cask:font-droid-sans-mono-nerd-font" = "latest"
"brew-cask:font-fira-code-nerd-font" = "latest"
"brew-cask:font-go-mono-nerd-font" = "latest"
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"
"brew-cask:font-sauce-code-pro-nerd-font" = "latest"
"brew-cask:font-source-code-pro" = "latest"
"brew-cask:font-ubuntu-nerd-font" = "latest"
# Herdr TUI; bootstrap installs the separate desktop app and core runtime.
"brew:herdr" = "latest"
"brew:yazi" = "latest"
"brew:wl-clipboard" = "latest"
"flatpak-user:org.mozilla.firefox" = "latest"

# The source tree mirrors $HOME; no package wrappers or Stow list are needed.
[dotfiles]
"~" = { source = "dotfiles", mode = "symlink-each", exclude = ["**/.zcompdump*"] }

[tasks.bootstrap]
description = "Install Herdr, enable the shared SSH agent, and apply Aurora defaults"
run = ["bash bootstrap/setup-ssh-agent.sh", "bash bootstrap/install-herdr.sh", "bash bootstrap/set-login-shell.sh", "bash bootstrap/set-terminal-defaults.sh"]
